# List native-build packages here if pnpm's default ignored-builds
# safety net blocks them (ERR_PNPM_IGNORED_BUILDS). esbuild (a transitive
# dependency of tsx) is a known-safe, widely used build tool.
allowBuilds:
  esbuild: true

# CLI Canon 0.2.0 is the required released baseline for Issue #310.
minimumReleaseAgeExclude:
  - "@yohn-jp/cli-canon@0.2.0"

# Dependency pins that intentionally lag "latest" (see package.json):
# - typescript: held at ^6.0.3. 7.x replaced the default export with a
#   version-only stub (exports map "." -> lib/version.cjs) and moved the
#   Compiler API (ts.SyntaxKind, ts.isClassDeclaration, ts.forEachChild, ...)
#   behind a different entry point. src/runtime/typescriptProvider.ts uses
#   that API directly, so bumping to 7.x needs a rewrite, not a version bump.
